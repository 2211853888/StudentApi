<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطلاب - StudentApi</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; padding: 30px; text-align: center; }
        .card { background: white; max-width: 650px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        input { padding: 10px; width: 45%; margin: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { background-color: #0078d4; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; margin: 10px 5px; }
        button:hover { background-color: #005a9e; }
        .add-btn { background-color: #107c41; }
        .add-btn:hover { background-color: #0b5a2f; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #0078d4; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>نظام إدارة الطلاب (SQL Server)</h1>

        <h2>إضافة طالب جديد</h2>
        <input type="text" id="studentName" placeholder="اسم الطالب" required />
        <input type="text" id="studentMajor" placeholder="التخصص" required /><br>
        <button class="add-btn" onclick="addStudent()">حفظ الطالب في قاعدة البيانات</button>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #eee;">

        <h2>قائمة الطلاب المسجلين</h2>
        <button onclick="fetchStudents()">تحديث القائمة من قاعدة البيانات</button>
        <table id="studentsTable">
            <thead>
                <tr>
                    <th>الرقم (ID)</th>
                    <th>الاسم</th>
                    <th>التخصص</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        async function fetchStudents() {
            try {
                const response = await fetch('/api/Student');
                const data = await response.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">لا توجد بيانات حالياً في قاعدة البيانات. أضيفي طالباً أولاً!</td></tr>';
                    return;
                }

                data.forEach(student => {
                    const row = `<tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.major}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                alert('حدث خطأ أثناء الاتصال بقاعدة البيانات');
            }
        }

        async function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const major = document.getElementById('studentMajor').value.trim();

            if (!name || !major) {
                alert('الرجاء كتابة الاسم والتخصص');
                return;
            }

            try {
                const response = await fetch('/api/Student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, major: major })
                });

                if (response.ok) {
                    document.getElementById('studentName').value = '';
                    document.getElementById('studentMajor').value = '';
                    fetchStudents();
                } else {
                    alert('فشل حفظ الطالب');
                }
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال');
            }
        }

        // جلب البيانات تلقائياً عند فتح الصفحة لأول مرة
        fetchStudents();
    </script>
</body>
</html>
